<div *ngIf = "profile" class="cta-container">
    <a [href]="" (click)="onClickResumeIcon($event)" class="cta-icon-resume" aria-label="Download resume">
        <img src="assets/logo-resume.png" alt="Resume" class="cta-logo">
    </a>
    <a [href]="" (click)="onClickLinkedinIcon($event)" class="cta-icon-linkedin" aria-label="LinkedIn">
        <img src="assets/logo-linkedin.png" alt="LinkedIn" class="cta-logo">
    </a>
    <a [href]="" (click)="onClickGitHubIcon($event)" class="cta-icon-github" aria-label="GitHub">
        <img src="assets/logo-github.png" alt="GitHub" class="cta-logo">
    </a>
    <a [href]="" (click)="onClickGmailIcon($event)" class="cta-icon-gmail" aria-label="Email">
        <img src="assets/logo-gmail.png" alt="Gmail" class="cta-logo">
    </a>
    <a [href]="" (click)="onClickPhoneIcon($event)" class="cta-icon-phone" aria-label="Phone">
        <img src="assets/logo-phone.png" alt="Phone" class="cta-logo">
    </a>
    <a [href]="" (click)="onClickWhatsappIcon($event)" class="cta-icon-whatsapp" aria-label="WhatsApp">
        <img src="assets/logo-whatsapp.png" alt="WhatsApp" class="cta-logo">
    </a>
</div>
