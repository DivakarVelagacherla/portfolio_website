<div *ngIf = "profile" class="cta-container">
    <a [href]="" (click)="onClickResumeIcon($event)" class="cta-icon-resume" aria-label="Download resume">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 3h7l4 4v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/>
            <path d="M14 3v4h4"/>
            <path d="M9 13h6"/>
            <path d="M9 16h6"/>
            <path d="M9 10h2"/>
        </svg>
    </a>
    <a [href]="" (click)="onClickLinkedinIcon($event)" class="cta-icon-linkedin" aria-label="LinkedIn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="4"/>
            <text x="12" y="16.5" text-anchor="middle" font-size="10.5" font-weight="700" fill="currentColor" stroke="none" font-family="inherit">in</text>
        </svg>
    </a>
    <a [href]="" (click)="onClickGitHubIcon($event)" class="cta-icon-github" aria-label="GitHub">
        <svg viewBox="0 0 24 24" fill="currentColor" stroke="none">
            <path d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34-.46-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.61.07-.61 1 .07 1.53 1.03 1.53 1.03.89 1.52 2.34 1.08 2.91.83.09-.65.35-1.08.63-1.33-2.22-.25-4.56-1.11-4.56-4.95 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.64 0 0 .84-.27 2.75 1.02a9.58 9.58 0 0 1 5 0c1.91-1.29 2.75-1.02 2.75-1.02.55 1.37.2 2.39.1 2.64.64.7 1.03 1.59 1.03 2.68 0 3.85-2.34 4.7-4.57 4.95.36.31.68.92.68 1.85v2.74c0 .27.18.58.69.48A10 10 0 0 0 12 2z"/>
        </svg>
    </a>
    <a [href]="" (click)="onClickGmailIcon($event)" class="cta-icon-gmail" aria-label="Email">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="5" width="18" height="14" rx="2"/>
            <path d="M3 7l9 6 9-6"/>
        </svg>
    </a>
