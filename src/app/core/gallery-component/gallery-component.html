<div class="gallery-section">

  <span class="gallery-eyebrow">GALLERY</span>
  <h2 class="gallery-title">Moments I chose to keep forever.</h2>

  <div class="gallery-wrapper">

    <div class="gallery-row row-1">
      <div class="gallery-tracker">
        <div class="gallery-card"
             *ngFor="let card of row1Cards"
             [style.transform]="getTransform(card.progress, row1CardWidth)"
             [style.transition]="card.noTransition ? 'none' : 'transform 0.8s cubic-bezier(0.645, 0.045, 0.355, 1)'"
             (click)="openLightbox(card)">
          <img [src]="getImageUrl(card.photo.key, 1200)" [alt]="card.photo.alt">
          <div class="gallery-card-overlay" *ngIf="card.photo.location || card.photo.year">
            <span *ngIf="card.photo.location">{{ card.photo.location }}</span>
            <span *ngIf="card.photo.location && card.photo.year"> · </span>
            <span *ngIf="card.photo.year">{{ card.photo.year }}</span>
          </div>
        </div>
      </div>
    </div>

    <div class="gallery-row row-2">
      <div class="gallery-tracker">
        <div class="gallery-card"
             *ngFor="let card of row2Cards"
             [style.transform]="getTransform(card.progress, row2CardWidth)"
             [style.transition]="card.noTransition ? 'none' : 'transform 0.8s cubic-bezier(0.645, 0.045, 0.355, 1)'"
             (click)="openLightbox(card)">
          <img [src]="getImageUrl(card.photo.key, 400)" [alt]="card.photo.alt">
          <div class="gallery-card-overlay" *ngIf="card.photo.location || card.photo.year">
            <span *ngIf="card.photo.location">{{ card.photo.location }}</span>
            <span *ngIf="card.photo.location && card.photo.year"> · </span>
            <span *ngIf="card.photo.year">{{ card.photo.year }}</span>
          </div>
        </div>
      </div>
    </div>

  </div>

  <div class="gallery-controls">
    <div class="controls-left"></div>
    <div class="dots">
      <div class="dots-track"
           [style.transform]="getDotsTrackTransform()"
           [style.transition]="dotsTransitionEnabled ? 'transform 0.4s cubic-bezier(0.16, 1, 0.3, 1)' : 'none'">
        <span class="dot"
              *ngFor="let card of row1Cards; let i = index"
              [class.active]="card.progress === 0"
              (click)="goToIndex(i)">
        </span>
      </div>
    </div>
    <div class="controls-right">
      <button class="pause-btn" (click)="pausePlay()" aria-label="Pause or play gallery and music">
        <span *ngIf="isPlaying">&#9646;&#9646;</span>
        <span *ngIf="!isPlaying">&#9654;</span>
      </button>
    </div>
  </div>

</div>

<!-- Lightbox -->
<div class="lightbox-overlay" *ngIf="selectedCard" (click)="closeLightbox()">
  <div class="lightbox-content" (click)="$event.stopPropagation()">

    <button class="lightbox-close" (click)="closeLightbox()" aria-label="Close lightbox">×</button>

    <button class="lightbox-arrow lightbox-prev" (click)="lightboxPrev()" aria-label="Previous photo">&#8592;</button>

    <img [src]="getImageUrl(selectedCard.photo.key, 1600)"
         [alt]="selectedCard.photo.alt"
    >

    <button class="lightbox-arrow lightbox-next" (click)="lightboxNext()" aria-label="Next photo">&#8594;</button>

    <div class="lightbox-meta" *ngIf="selectedCard.photo.location || selectedCard.photo.year">
      <span *ngIf="selectedCard.photo.location">{{ selectedCard.photo.location }}</span>
      <span *ngIf="selectedCard.photo.location && selectedCard.photo.year">·</span>
      <span *ngIf="selectedCard.photo.year">{{ selectedCard.photo.year }}</span>
    </div>

  </div>
</div>
