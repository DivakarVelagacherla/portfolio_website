<div class="dashboard-label">Live Dashboard - Updated Daily</div>
<div class="dashboard-container">
    <div class="stats">
        <div class="stats-number">{{stats?.yearsOfExperience}}+</div>
        <span class="stats-label">Years of Experience</span>
    </div>
    <div class="stats">
        <div class="stats-number">{{stats?.totalRepos}}</div>
        <span class="stats-label">Total Repos</span>
    </div>
    <div class="stats">
        <div class="stats-number">{{stats?.totalCommits}}</div>
        <span class="stats-label">Total Commits</span>
    </div>
    <div class="stats">
        <div class="stats-number">{{stats?.totalPrs}}</div>
        <span class="stats-label">Total PR's</span>
    </div>
    <div class="stats">
        <div class="stats-number">{{stats?.totalLeetcodeSolved}}</div>
        <span class="stats-label">Total Leetcode Solved</span>
    </div>
</div>
