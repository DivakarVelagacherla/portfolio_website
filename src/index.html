<!doctype html>
<html lang="en">
<head>
  <script>
    var redirect = new URLSearchParams(window.location.search).get('redirect');
    if (redirect) {
      window.history.replaceState(null, null, redirect);
    }
  </script>
  <script>
    const theme = localStorage.getItem('theme');
    if (theme) {
      document.documentElement.setAttribute('data-theme', theme);
    }
    document.documentElement.classList.add('no-transition');
  </script>
  <style>
    html[data-theme="dark"] { background-color: #0a0a0a; color: #e8e8ed; }
  </style>
  <meta charset="utf-8">
  <title>DV Portfolio</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="DV">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>
